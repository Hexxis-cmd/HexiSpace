<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">HexiSpace mark</title>
  <desc id="desc">A luminous hexagonal core surrounded by three orbital arcs.</desc>
  <defs>
    <linearGradient id="core" x1="24" y1="232" x2="224" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ff7df"/><stop offset=".52" stop-color="#8f83ff"/><stop offset="1" stop-color="#ffc879"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#92fff0" stop-opacity=".9"/><stop offset="1" stop-color="#92fff0" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="128" cy="128" r="106" fill="url(#glow)" opacity=".16"/>
  <g fill="none" stroke="url(#core)" stroke-linecap="round">
